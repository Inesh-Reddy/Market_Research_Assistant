[project]
name = "financial-intelligence-backend"
version = "0.1.0"
description = "Multi-Agent Financial Intelligence Platform - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
strands = ["strands-agents>=0.1.0"]
dev = ["pytest>=8.0.0","pytest-asyncio>=0.23.0","ruff>=0.5.0","httpx>=0.27.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
# BLE001/S110: tool/provider failure isolation is by design (graceful degradation per spec);
# failures are surfaced as agent/tool.failed events, never silently swallowed.
ignore = ["BLE001", "S110"]
